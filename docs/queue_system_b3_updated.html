<div style="display:flex;gap:16px;flex-wrap:wrap;">

  <div>
    <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px;">B-1. 発券前(更新機能追加)</p>
    <div style="background:var(--surface-1);border-radius:12px;padding:20px;width:250px;">
      <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:20px;text-align:center;position:relative;">
        <button style="position:absolute;top:10px;right:10px;width:28px;height:28px;padding:0;border-color:var(--border);" aria-label="更新"><i class="ti ti-refresh" style="font-size:14px;" aria-hidden="true"></i></button>
        <p style="font-size:12px;color:var(--text-secondary);margin:0 0 8px;">ただいまの呼出し番号</p>
        <p style="font-size:36px;font-weight:500;margin:0 0 12px;">038</p>
        <div style="background:var(--surface-1);border-radius:8px;padding:8px;margin-bottom:16px;">
          <p style="font-size:11px;color:var(--text-muted);margin:0 0 2px;">現在の待機人数</p>
          <p style="font-size:16px;font-weight:500;margin:0;">7</p>
        </div>
        <button style="width:100%;height:44px;background:var(--fill-accent);color:var(--on-accent);border:none;font-size:15px;font-weight:500;">番号を取る</button>
      </div>
    </div>
  </div>

  <div>
    <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px;">B-3. 発券後(更新機能追加)</p>
    <div style="background:var(--surface-1);border-radius:12px;padding:20px;width:250px;">
      <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:20px;text-align:center;position:relative;">
        <button style="position:absolute;top:10px;right:10px;width:28px;height:28px;padding:0;border-color:var(--border);" aria-label="更新"><i class="ti ti-refresh" style="font-size:14px;" aria-hidden="true"></i></button>
        <p style="font-size:12px;color:var(--text-muted);margin:0 0 4px;">あなたの番号</p>
        <p style="font-size:36px;font-weight:500;margin:0 0 12px;color:var(--text-accent);">042</p>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <div style="flex:1;background:var(--surface-1);border-radius:8px;padding:8px;">
            <p style="font-size:11px;color:var(--text-muted);margin:0 0 2px;">呼出し中</p>
            <p style="font-size:16px;font-weight:500;margin:0;">038</p>
          </div>
          <div style="flex:1;background:var(--surface-1);border-radius:8px;padding:8px;">
            <p style="font-size:11px;color:var(--text-muted);margin:0 0 2px;">あなたより前</p>
            <p style="font-size:16px;font-weight:500;margin:0;">4</p>
          </div>
        </div>
        <button style="width:100%;height:36px;color:var(--text-danger);border-color:var(--border);font-size:13px;">キャンセルする</button>
      </div>
    </div>
  </div>

</div>
